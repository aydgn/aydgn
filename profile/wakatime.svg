<?xml version="1.0" encoding="UTF-8"?>
<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId descId">
  <title id="titleId">WakaTime Stats</title>
  <desc id="descId">All-time aggregate coding time: 6,700 hrs 44 mins. Top languages: JavaScript 8.19%, HTML 7.99%, Markdown 4.45%, SCSS 3.96%, Astro 2.25%, JSON 1.82%.</desc>
  <style>
    .card { fill: #fffefe; stroke: #e4e2e2; }
    .title { fill: #2f80ed; font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; }
    .subtitle { fill: #57606a; font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; }
    .lang-name { fill: #434d58; font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; }
    .lang-value { fill: #57606a; font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .title { fill: #58a6ff; }
      .subtitle, .lang-value { fill: #8b949e; }
      .lang-name { fill: #c9d1d9; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="494" height="194" rx="4.5" />
  <text x="25" y="32" class="title">WakaTime Stats</text>
  <text x="25" y="52" class="subtitle">All time · 6,700 hrs 44 mins</text>
  <g clip-path="url(#language-bar-clip)" data-testid="lang-progress">
    <rect x="25.00" y="72" width="127.17" height="8" fill="#f1e05a" />
    <rect x="152.17" y="72" width="124.06" height="8" fill="#e34c26" />
    <rect x="276.22" y="72" width="69.09" height="8" fill="#083fa1" />
    <rect x="345.32" y="72" width="61.49" height="8" fill="#c6538c" />
    <rect x="406.81" y="72" width="34.94" height="8" fill="#8b949e" />
    <rect x="441.74" y="72" width="28.26" height="8" fill="#292929" />
  </g>
  <clipPath id="language-bar-clip">
    <rect x="25" y="72" width="445" height="8" rx="4" />
  </clipPath>
    <g data-testid="lang-item">
      <circle cx="30" cy="109" r="5" fill="#f1e05a" />
      <text data-testid="lang-name" x="40" y="113" class="lang-name">JavaScript</text>
      <text x="235" y="113" text-anchor="end" class="lang-value">8.19%</text>
    </g>
    <g data-testid="lang-item">
      <circle cx="30" cy="134" r="5" fill="#e34c26" />
