    <rect x="440.87" y="72" width="29.13" height="8" fill="#8b949e" />
  </g>
  <clipPath id="language-bar-clip">
    <rect x="25" y="72" width="445" height="8" rx="4" />
  </clipPath>
    <g data-testid="lang-item">
