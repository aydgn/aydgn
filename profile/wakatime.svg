      <text x="235" y="138" text-anchor="end" class="lang-value">7.99%</text>
    </g>
    <g data-testid="lang-item">
      <circle cx="30" cy="159" r="5" fill="#083fa1" />
      <text data-testid="lang-name" x="40" y="163" class="lang-name">Markdown</text>
      <text x="235" y="163" text-anchor="end" class="lang-value">4.45%</text>
    </g>
    <g data-testid="lang-item">
      <circle cx="260" cy="109" r="5" fill="#c6538c" />
      <text data-testid="lang-name" x="270" y="113" class="lang-name">SCSS</text>
