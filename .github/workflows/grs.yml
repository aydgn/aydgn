name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Ensure profile directory
        run: mkdir -p profile

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&count_private=true&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate WakaTime card
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: node .github/scripts/generate-wakatime-card.mjs

      - name: Refresh README card cache
        run: |
          if [ -z "$(git status --porcelain -- profile)" ]; then
            exit 0
          fi

          version="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          sed -E -i \
            -e "s#(\./profile/wakatime\.svg)(\?v=[^)]+)?#\1?v=${version}#g" \
            -e "s#(\./profile/stats\.svg)(\?v=[^)]+)?#\1?v=${version}#g" \
            -e "s#(\./profile/top-langs\.svg)(\?v=[^)]+)?#\1?v=${version}#g" \
            readme.md

      - name: Commit cards
        run: |
          if [ -z "$(git status --porcelain -- profile readme.md)" ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg readme.md
          git commit -m "Update README cards"
          git push
